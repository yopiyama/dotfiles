# 内部的な通し番号のガード設定。id-guard.sh が参照する。
#
# 考え方: ID の「種類」ごとに、書き込み先（宛先）ごとの許容度を決める。
# 同じ ID でも Obsidian に書くなら問題なく、コードコメントに書くと
# 読み手が辿れないゴミになる。宛先が外に出るほど厳しくする。
#
# 各行は「# はコメント、空行は無視」。セクションは [名前] で始まる。

# ---------------------------------------------------------------------------
# ID の種類。label = 説明、それ以外の行は ERE（grep -oE に渡す）。
# ---------------------------------------------------------------------------

[kind:review-id]
label = code-review スキルが付ける指摘 ID
# MUST-1 / WANT-3 / NITS-10 / TWEET-2 / ASK-1。ラウンドをまたいだ会話用の一時 ID で、
# コードや Issue のトラッキング ID ではない（code-review/SKILL.md の注意書き参照）。
\b(MUST|WANT|NITS|TWEET|ASK)-[0-9]{1,3}\b
# 旧書式（P1-1 / P2-3）。既存のタスクノートに残っているので併せて見る。
\bP[1-3]-[0-9]{1,3}\b

[kind:conversation-seq]
label = 私と Claude のやり取りの中でだけ通じる通し番号
# 「指摘 3」「論点2」など。そのセッションで付けただけの番号で、
# 次のセッションでも他人でも辿れない。
(指摘事項|レビュー指摘|指摘|論点)[[:space:]]*(No\.?|#|番号|番)?[[:space:]]*[0-9]{1,3}
# 誤検知が怖いので既定では見ない。必要になったらコメントを外す。
# (タスク|項目|質問|課題)[[:space:]]*(No\.?|#|番号|番)?[[:space:]]*[0-9]{1,3}

[kind:vault-local]
label = Obsidian vault の中でしか引けない ID / パス
# vault 相対パス。`<プロジェクト名>` のようなプレースホルダを含む
# ドキュメント上の記述は対象外にしたいので、< > を含まない実パスだけ拾う。
ClaudeCode/[^<>[:space:]"'\`]+/[^<>[:space:]"'\`]+
# 会話ログ・サブエージェントのセッション ID（裸の UUID は誤検知するので
# session_id / agent- が前に付いている形だけ見る）
session_id[[:space:]]*[:=][[:space:]]*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
agent-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
# pr-comments のタスク子ノートの連番（PR-123/03_ など）
PR-[0-9]+/[0-9]{2}_

[kind:pbi-local]
label = PBI / チケットの中でだけ通じるローカル番号
# 「非機能要件3」「項番12」「要件⑥」など。その PBI を開いている人には
# 通じるが、コードコメントに書くと何番が何だったか辿れない。
# 丸数字はブラケット範囲がロケール依存なので列挙する。
(非機能要件|機能要件|受入条件|受け入れ条件|要件|項番|項目番号)[[:space:]]*(No\.?)?[[:space:]]*([0-9]{1,3}|①|②|③|④|⑤|⑥|⑦|⑧|⑨|⑩|⑪|⑫|⑬|⑭|⑮|⑯|⑰|⑱|⑲|⑳)

# ---------------------------------------------------------------------------
# 宛先ごとのポリシー。`<allow|ask|deny> <種類>`。
# 書かれていない種類は allow。deny > ask の順で強い判定が勝つ。
# ---------------------------------------------------------------------------

# コード / ドキュメント / GitHub コメント / コミットメッセージ。
# 一番外に出るので全部 deny。
[destination:external]
deny review-id
deny conversation-seq
deny vault-local
deny pbi-local

# Notion。PBI 内のローカル番号は Notion 上なら文脈が繋がるので allow。
# vault / 会話ローカルの ID は Notion 側から辿れないので都度確認。
[destination:notion]
allow pbi-local
ask review-id
ask conversation-seq
ask vault-local

# Obsidian vault は全部 allow（セクションを空にしておく = 何も判定しない）。
[destination:obsidian]

# ---------------------------------------------------------------------------
# Write / Edit の宛先判定
# ---------------------------------------------------------------------------

# ここ配下への書き込みは「自分用のメモ」扱いで一切判定しない。
# $HOME と $VAULT を展開する。
[allow_path]
$VAULT
$HOME/.claude/projects
$HOME/.claude/plans
/tmp
/private/tmp
/var/folders

# リポジトリ内でも、ここにマッチするパスは判定しない。
# Claude 用のツール定義自体は vault のパス構成や指摘 ID の書式を
# 説明する必要があるため（このファイルや id-guard の回帰テストを含む）。
[exempt_path]
/.claude/hooks/
/.claude/skills/

# ---------------------------------------------------------------------------
# Bash の宛先判定。ここに挙げたコマンドだけ external として本文を検査する。
# （それ以外の Bash は素通し。obs.sh の書き込みもここに無いので素通し）
# ---------------------------------------------------------------------------

[external_command]
gh pr comment
gh pr create
gh pr edit
gh pr review
gh issue comment
gh issue create
gh issue edit
gh release create
git commit
