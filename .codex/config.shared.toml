# Codex のユーザー設定で、全端末に強制するトップレベル値と共有 table の source of truth。
#
# scripts/sync-codex-config.sh は、このファイルに書かれたトップレベル値と
# table と [mcp_servers.<name>] table を ~/.codex/config.toml へ反映する。Desktop が追記する
# project trust、UI 状態、プラグイン情報、共有対象外の MCP OAuth 情報などは保持する。
#
# approval_policy、sandbox_mode、default_permissions のようなトップレベルの
# permission 設定も、意図を決めたらここへ追加できる。ここに明示した table だけを共有する。
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
personality = "pragmatic"
service_tier = "default"
default_permissions = "protected-workspace"

[features]
# 過去の Codex セッションから生成したローカルメモリを、以後のセッションで利用する。
memories = true

# workspace-write 相当の作業範囲と外向き通信を保ち、機密ファイルの読み取りを拒否する。
[permissions.protected-workspace]
extends = ":workspace"

[permissions.protected-workspace.network]
enabled = true

# Claude Code の Read/Edit deny と同じファイル群を、workspace root 配下で保護する。
[permissions.protected-workspace.filesystem]
":workspace_roots" = { ".env*" = "deny", "**/.env*" = "deny", "*.env" = "deny", "**/*.env" = "deny", "id_*" = "deny", "**/id_*" = "deny", "*.pem" = "deny", "**/*.pem" = "deny", "*.key" = "deny", "**/*.key" = "deny" }

# ctxpack-mcp は ctxpack を stdio MCP server として公開する。Apple Silicon Mac の
# Homebrew prefix を明示し、Desktop がログイン shell の PATH を継承しない場合にも備える。
[mcp_servers.ctxpack]
command = "/opt/homebrew/bin/ctxpack-mcp"
enabled_tools = ["pack", "pack_content", "stats"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 10
tool_timeout_sec = 30

[mcp_servers.ctxpack.tools.pack]
output_token_limit = 8000

[tui]
status_line = [
  "run-state",
  "approval-mode",
  "permissions",
  "model-with-reasoning",
  "context-used",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "git-branch",
  "pull-request-number",
]
status_line_use_colors = true
